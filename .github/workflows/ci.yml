---
name: CI

on:
  push:
  pull_request:

jobs:
  # -------------------------------------------------------------------------
  # Build the host configuration and run the unit tests under
  # AddressSanitizer and UndefinedBehaviorSanitizer.
  # -------------------------------------------------------------------------
  build-and-test:
    name: Build and test (host)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      # --output-on-failure prints the failing assertion instead of only
      # reporting which test failed.
      #
      # This covers the C suites, the Python tooling tests (which drive
      # the real core through a shared library), and the constant-sync
      # check, since all three are registered with CTest.
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # -------------------------------------------------------------------------
  # Enforce that core/ stays hardware-independent.
  #
  # Comments mentioning STM32 are allowed; only real code
  # dependencies are rejected.
  # -------------------------------------------------------------------------
  layering:
    name: core/ is hardware-independent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # grep exits 1 when it finds nothing, which is the success case here,
      # so the check is wrapped in `if` rather than run bare under `set -e`.
      - name: No hardware headers in core/
        run: |
          pattern='#include[[:space:]]*[<"](stm32|core_cm|cmsis)'
          if grep -rnE "$pattern" core/; then
            echo "::error::core/ must not include hardware headers"
            exit 1
          fi

      - name: No HAL calls in core/
        run: |
          if grep -rnE '\bHAL_[A-Za-z]' core/; then
            echo "::error::core/ must not call STM32 HAL functions"
            exit 1
          fi

      # port/host exists to be swapped out for a real target port. If core/
      # reaches into it directly, the seam is gone.
      - name: No port implementation details in core/
        run: |
          if grep -rnE '#include[[:space:]]*"bl_port_host\.h"' core/; then
            echo "::error::core/ must use bl_port.h, not a port implementation"
            exit 1
          fi

  # -------------------------------------------------------------------------
  # The Python tooling implements the other half of the wire protocol and
  # the image format. Its own tests run inside the CTest suite above, so
  # this job covers the parts that do not need the compiled core: that
  # every module parses, and that an image built by mkimage.py is one the
  # C definitions describe.
  # -------------------------------------------------------------------------
  python-tools:
    name: Python tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Byte-compile tools
        run: python -m compileall -q tools/

      # Compares every shared constant against the C headers. Nothing in
      # either build would otherwise notice a value changing on one side
      # only; the failure would surface as a corrupt image or an
      # unintelligible response rather than as a mismatch.
      - name: Constants match the C headers
        run: python3 tools/check_sync.py .

      - name: mkimage produces a loadable image
        run: |
          head -c 4096 /dev/urandom > /tmp/app.bin
          python3 tools/mkimage.py /tmp/app.bin --version 1.2.3
          PYTHONPATH=tools python3 - <<'PY'
          import blimage

          image = open('/tmp/app.blimg', 'rb').read()
          header = blimage.validate(image)

          assert header.entry_offset == blimage.HDR_REGION_SIZE
          assert header.fw_version == 0x00010203
          assert set(image[40:blimage.HDR_REGION_SIZE]) <= {0xFF}

          print('image OK:', len(image), 'bytes, payload at',
                header.entry_offset)
          PY
